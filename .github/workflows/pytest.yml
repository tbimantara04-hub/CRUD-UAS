# =============================================================================
# GitHub Actions Workflow — Automated Testing Pipeline
# Author      : Satria Tegar Bimantara
# Repository  : https://github.com/tbimantara04-hub/CRUD-UAS
# Description : Pipeline CI/CD untuk mengeksekusi Selenium + Pytest secara
#               otomatis dengan dukungan eksekusi paralel via pytest-xdist.
#               Berjalan pada setiap push dan pull request ke semua branch.
# =============================================================================

name: "🚀 CI — Automated Selenium Test Suite (Parallel)"

on:
  push:
    branches:
      - "**"
  pull_request:
    branches:
      - "**"

env:
  APP_DIR: /var/www/html/DamnCRUD
  DB_NAME: damncrud
  DB_USER: root
  DB_PASSWORD: ""
  BASE_URL: "http://localhost"

jobs:
  automated-tests:
    name: "🧪 Run Selenium Tests (Parallel)"
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: ""
          MYSQL_ALLOW_EMPTY_PASSWORD: "yes"
          MYSQL_DATABASE: damncrud
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4

      - name: "🐘 Setup PHP 8.1 with Extensions"
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          extensions: mysqli, pdo_mysql, mbstring
          tools: composer

      - name: "🐍 Setup Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: "🌐 Install Google Chrome & ChromeDriver"
        run: |
          wget -q -O - https://dl.google.com/linux/linux_signing_key.pub | \
            sudo gpg --dearmor -o /usr/share/keyrings/google-chrome-keyring.gpg
          echo "deb [arch=amd64 signed-by=/usr/share/keyrings/google-chrome-keyring.gpg] \
            http://dl.google.com/linux/chrome/deb/ stable main" | \
            sudo tee /etc/apt/sources.list.d/google-chrome.list

          sudo apt-get update -qq
          sudo apt-get install -y google-chrome-stable chromium-driver || true

          google-chrome --version
          chromedriver --version

      - name: "🖥️ Start PHP Built-in Web Server"
        run: |
          # Jalankan PHP server di background pada port 80
          sudo php -S 127.0.0.1:80 -t . &
          sleep 2

      - name: "🗄️ Initialize MySQL Database"
        run: |
          until mysqladmin ping -h 127.0.0.1 --silent; do
            echo "Menunggu MySQL..."
            sleep 2
          done

          mysql -h 127.0.0.1 -u root < db/damncrud.sql
          echo "✅ Database dan tabel berhasil diinisialisasi."

      - name: "📦 Install Python Test Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install \
            selenium>=4.15.0 \
            pytest>=7.4.0 \
            pytest-xdist>=3.3.1 \
            pytest-html>=4.0.0 \
            pytest-timeout>=2.1.0 \
            pytest-rerunfailures>=12.0 \
            webdriver-manager>=4.0.0

      - name: "🔍 Verify Application Accessibility"
        run: |
          sleep 3
          HTTP_STATUS=$(curl -o /dev/null -s -w "%{http_code}" http://localhost/login.php)
          echo "HTTP Status Code: $HTTP_STATUS"
          if [ "$HTTP_STATUS" -ne 200 ] && [ "$HTTP_STATUS" -ne 302 ]; then
            echo "❌ GAGAL: Aplikasi tidak dapat diakses. Status: $HTTP_STATUS"
            exit 1
          fi

      - name: "🚀 Execute Pytest Suite (Parallel via pytest-xdist)"
        run: |
          # Jalankan pengujian secara paralel menggunakan test_suite.py
          pytest test_suite.py \
            -n auto \
            --timeout=60 \
            --html=reports/test_report.html \
            --self-contained-html \
            --junitxml=reports/junit_report.xml \
            -v \
            --tb=short \
            --color=yes
